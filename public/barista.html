<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>KAVA — Панель бариста</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17100b; --card: #241712; --card-lift: #2e1e16; --edge: #3a261c;
    --cream: #f6e8d8; --muted: #a98a76; --caramel: #e0a35c;
    --terra: #d2603a; --terra-deep: #b6492a;
    --ok: #6fce8e; --danger: #ff6b57;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { font-family:'Manrope',system-ui,sans-serif; color:var(--cream); height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    background: radial-gradient(900px 480px at 80% -10%, rgba(224,163,92,.15), transparent 55%), var(--bg); }
  .header { padding:14px 16px; border-bottom:1px solid var(--edge); display:flex; align-items:center; gap:12px; background:linear-gradient(180deg, rgba(46,30,22,.7), transparent); }
  .back-btn { width:44px; height:44px; border-radius:12px; border:1px solid var(--edge); background:var(--card); color:var(--cream); font-size:18px; cursor:pointer; }
  .brand-mark { width:44px; height:44px; border-radius:12px; background:radial-gradient(circle at 35% 30%, #e28057, var(--terra) 70%); display:flex; align-items:center; justify-content:center; font-size:21px; }
  .header h1 { font-family:'Fraunces',serif; font-weight:700; font-size:18px; }
  .header p { font-size:10.5px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; font-weight:700; margin-top:2px; }

  .stats { display:flex; gap:8px; padding:12px 14px 0; }
  .stat { flex:1; background:var(--card); border:1px solid var(--edge); border-radius:14px; padding:9px 12px; }
  .stat b { font-family:'Fraunces',serif; font-size:19px; color:var(--caramel); }
  .stat span { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:700; }

  .main-scroll { flex:1; overflow-y:auto; padding:12px 14px 100px; display:flex; flex-direction:column; gap:14px; }
  .list { display:flex; flex-direction:column; gap:14px; }

  .cat-block { background:var(--card); border:1px solid var(--edge); border-radius:18px; overflow:hidden; }
  .cat-head { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card-lift); border-bottom:1px solid var(--edge); }
  .cat-emoji { font-size:19px; }
  .cat-name { font-family:'Fraunces',serif; font-weight:700; font-size:15px; flex:1; }
  .icon-btn { width:36px; height:36px; border-radius:10px; border:1px solid var(--edge); background:transparent; color:var(--cream); font-size:15px; cursor:pointer; }
  .icon-btn.danger { color:var(--danger); border-color:rgba(255,107,87,.35); }

  .product { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.04); }
  .product:last-child { border-bottom:0; }
  .thumb { width:52px; height:52px; border-radius:13px; object-fit:cover; background:var(--card-lift); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .p-info { flex:1; min-width:0; }
  .p-name { font-weight:800; font-size:13.5px; }
  .p-desc { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-meta { font-size:12px; color:var(--caramel); font-weight:800; margin-top:2px; }
  .p-off { opacity:.55; filter:grayscale(.5); }
  .p-hidden-badge { display:inline-block; margin-left:6px; background:rgba(255,107,87,.16); color:var(--danger); font-size:9px; padding:2px 7px; border-radius:7px; text-transform:uppercase; letter-spacing:.09em; vertical-align:2px; font-weight:800; }

  .fab { position:fixed; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); left:14px; right:14px; z-index:30;
    border:none; border-radius:18px; padding:16px; background:linear-gradient(160deg, #d2603a, var(--terra-deep)); color:#fff;
    font-family:'Manrope'; font-size:15px; font-weight:800; box-shadow:0 10px 26px rgba(210,96,58,.4); cursor:pointer; }

  /* sheets */
  .overlay { position:fixed; inset:0; z-index:50; background:rgba(23,16,11,.7); backdrop-filter: blur(6px); display:none; align-items:flex-end; }
  .overlay.open { display:flex; }
  .sheet { background:var(--bg); width:100%; border-radius:22px 22px 0 0; padding:14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-height:92%; overflow-y:auto; display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--edge); }
  .grabber { width:44px; height:5px; border-radius:3px; background:rgba(246,232,216,.2); margin:0 auto; }
  .sheet h3 { font-family:'Fraunces',serif; font-size:19px; }

  .field label { display:block; font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
  .field input, .field select { width:100%; padding:12px; border-radius:13px; background:var(--card); border:1px solid var(--edge); color:var(--cream); font-size:15px; font-family:'Manrope'; font-weight:600; }
  .row2 { display:flex; gap:10px; }
  .row2 > .field { flex:1; }

  .img-picker { display:flex; align-items:center; gap:12px; }
  .img-preview { width:84px; height:84px; border-radius:16px; object-fit:cover; background:var(--card); border:1px dashed var(--edge); display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--muted); }
  .img-actions { display:flex; flex-direction:column; gap:8px; flex:1; }
  .btn { border:none; border-radius:13px; padding:13px; font-family:'Manrope'; font-weight:800; font-size:14px; cursor:pointer; }
  .btn-primary { background:linear-gradient(160deg,#d2603a,var(--terra-deep)); color:#fff; }
  .btn-ghost { background:transparent; border:1px solid var(--edge); color:var(--cream); }
  .btn-ok { background:var(--ok); color:#0b2413; }
  .btn-danger { background:rgba(255,107,87,.15); color:var(--danger); border:1px solid rgba(255,107,87,.35); }

  /* toast */
  .toast { position:fixed; bottom:110px; left:50%; transform:translate(-50%, 20px); z-index:60; background:var(--card-lift); border:1px solid var(--edge); color:var(--cream); padding:12px 18px; border-radius:13px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s; white-space:nowrap; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }

  .barista-admin { background:var(--card); border:1px solid var(--edge); border-radius:18px; padding:14px; }
  .barista-admin h3 { font-size:15px; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .barista-admin p { font-size:11.5px; color:var(--muted); margin-bottom:12px; }
  .barista-row { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid rgba(255,255,255,.05); }
  .barista-row:last-child { border-bottom:0; }
  .b-avatar { width:40px; height:40px; border-radius:12px; background:var(--card-lift); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:var(--caramel); }
  .b-info { flex:1; min-width:0; }
  .b-name { font-size:13.5px; font-weight:800; }
  .b-id { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .b-role { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ok); background:rgba(111,206,142,.12); border-radius:8px; padding:4px 8px; }
  .admin-add-row { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .admin-add-row input { width:100%; padding:12px; border-radius:13px; background:var(--card-lift); border:1px solid var(--edge); color:var(--cream); font-size:14px; }

  .empty-state { text-align:center; color:var(--muted); padding:50px 20px; font-size:13px; line-height:1.6; }


  :root {
    --bg: #17100b;
    --card: #241712;
    --card-lift: #2e1e16;
    --edge: #3a261c;
    --cream: #f6e8d8;
    --muted: #a98a76;
    --caramel: #e0a35c;
    --terra: #d2603a;
    --terra-deep: #b6492a;
    --ok: #6fce8e;
    --danger: #ff6b57;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:'Manrope', system-ui, sans-serif;
    color:var(--cream);
    height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    background:
      radial-gradient(1000px 480px at 80% -10%, rgba(224,163,92,.16), transparent 55%),
      radial-gradient(800px 480px at -20% 40%, rgba(210,96,58,.14), transparent 55%),
      var(--bg);
  }

  .header {
    padding:16px 16px 14px; border-bottom:1px solid var(--edge);
    display:flex; align-items:center; gap:12px;
    background: linear-gradient(180deg, rgba(46,30,22,.7), transparent);
  }
  .brand-mark { width:46px; height:46px; border-radius:14px; background: radial-gradient(circle at 35% 30%, #e28057, var(--terra) 70%); display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 6px 14px rgba(210,96,58,.35); }
  .header h1 { font-family:'Fraunces', serif; font-weight:700; font-size:19px; line-height:1.1; }
  .header p { font-size:11px; color:var(--muted); margin-top:3px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
  .live-dot { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:800; color:var(--ok); letter-spacing:.06em; text-transform:uppercase; }
  .live-dot::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(111,206,142,.6); animation:pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 9px rgba(111,206,142,0); } 100% { box-shadow:0 0 0 0 rgba(111,206,142,0); } }
  .edit-orders-link { width:44px; height:44px; border-radius:12px; border:1px solid var(--edge); background:var(--card); color:var(--cream); font-size:19px; text-decoration:none; display:flex; align-items:center; justify-content:center; }

  .list { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; padding-bottom:24px; }

  .order {
    background:var(--card); border:1px solid var(--edge); border-radius:20px;
    padding:14px 16px; display:flex; flex-direction:column; gap:10px;
    animation: cardIn .35s ease both;
  }
  @keyframes cardIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .order.due { border-color:var(--danger); box-shadow: 0 0 0 1px rgba(255,107,87,.35), 0 8px 30px rgba(255,107,87,.12); }

  .top { display:flex; align-items:baseline; gap:10px; }
  .num { font-family:'Fraunces', serif; font-weight:900; font-size:24px; color:var(--caramel); }
  .status { margin-left:auto; font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 12px; border-radius:100px; background:var(--card-lift); color:var(--muted); border:1px solid var(--edge); }
  .status.preparing { color:var(--caramel); border-color:rgba(224,163,92,.4); }
  .status.ready { color:var(--ok); border-color:rgba(111,206,142,.4); }

  .items { font-size:14px; line-height:1.4; color:var(--cream); }
  .meta { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); font-weight:600; }
  .meta b { color:var(--cream); }

  .countdown {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card-lift); border:1px dashed var(--edge); border-radius:16px; padding:10px 14px;
  }
  .countdown span:first-child { font-size:11.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .countdown .time { font-family:'Fraunces', serif; font-weight:700; font-size:24px; font-variant-numeric:tabular-nums; color:var(--caramel); }
  .countdown.due .time { color:var(--danger); }

  .btn {
    border:none; border-radius:16px; padding:14px; font-family:'Manrope'; font-size:15px; font-weight:800;
    color:#fff; width:100%; cursor:pointer; letter-spacing:.02em;
    background: linear-gradient(160deg, #d2603a, var(--terra-deep));
    box-shadow: 0 8px 22px rgba(210,96,58,.35); transition: transform .15s;
  }
  .btn:active { transform: scale(.97); }

  .empty { text-align:center; color:var(--muted); padding:60px 24px; font-size:14px; line-height:1.6; }
  .empty b { display:block; font-family:'Fraunces', serif; font-size:22px; color:var(--cream); margin-bottom:8px; }

  .view-tabs { display:flex; gap:10px; padding:14px 14px 0; }
  .view-tab { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 14px; border:1px solid var(--edge); border-radius:15px; background:var(--card); font-family:'Manrope'; font-weight:800; font-size:14.5px; color:var(--muted); cursor:pointer; }
  .view-tab.active { background:var(--card-lift); color:var(--cream); border-color:rgba(224,163,92,.55); }
  .hidden { display:none !important; }
  .view { display:flex; flex-direction:column; }


  .bic { width:44px;height:44px; display:inline-flex; color:#f6e8d8; }
  .tic { width:18px;height:18px; display:inline-flex; vertical-align:-3px; }
  .tab-ic { width:22px;height:22px; display:inline-flex; }
  .pic { width:20px;height:20px; display:inline-flex; vertical-align:-4px; }
  .fab-ic { width:22px;height:22px; }
  .empty-cake { width:44px;height:44px; margin-bottom:10px; color:var(--caramel); }

</style>
</head>
<body>
<div class="header">
  <div class="brand-mark"><span class="bic"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10h2a3 3 0 0 1 3 3v1a5 5 0 0 1-5 5H6a5 5 0 0 1-5-5v-1a3 3 0 0 1 3-3h13z"/><path d="M6 21h12M9 6c0-1 .8-1 .8-2M12.5 6c0-1 .8-1 .8-2M16 6c0-1 .8-1 .8-2"/></svg></span></div>
  <div>
    <h1>Панель бариста</h1>
    <p>KAVA · выдача & меню</p>
  </div>
  <div class="live-dot">live</div>
</div>

<div class="view-tabs">
  <button class="view-tab active" id="tab-orders"><span class="tab-ic"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V4"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg></span> Заказы</button>
  <button class="view-tab" id="tab-menu"><span class="tab-ic"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/></svg></span> Редактировать</button>
</div>

<div id="view-orders" class="view">
  <div id="orders-box" class="list"></div>
</div>

<div id="view-menu" class="view hidden">
<div class="stats">
  <div class="stat"><b id="stat-products">–</b><span>позиций</span></div>
  <div class="stat"><b id="stat-categories">–</b><span>категорий</span></div>
  <div class="stat"><b id="stat-images">–</b><span>с фото</span></div>
</div>

<div class="main-scroll">
<div id="editor-list" class="list"></div>
<div id="empty" class="empty-state hidden" style="display:none"></div>

<section class="barista-admin hidden" id="barista-admin-section" style="display:none">
  <h3><span class="tic"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-4 3-7 6-7s6 3 6 7"/><path d="M16 4.4a3.2 3.2 0 0 1 0 6.2"/><path d="M17.5 13.6c2.5.6 3.9 2.4 3.9 6.4"/></svg></span> Бариста <span style="font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase">только для админа</span></h3>
  <p>Добавьте Telegram ID бариста — он получит уведомления о заказах и доступ к панели.</p>
  <div id="barista-list"></div>
  <div class="admin-add-row">
    <input id="barista-add-id" inputmode="numeric" placeholder="Telegram ID, напр. 7760685021" />
    <input id="barista-add-name" placeholder="Имя (необязательно)" maxlength="120" />
    <button id="barista-add-btn" class="btn btn-primary"><span class="tic"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span> Добавить баристу</button>
  </div>
</section>
</div>

<button class="fab" id="add-product-btn"><span class="tic fab-ic"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span> Добавить товар</button>

<div class="overlay" id="product-overlay">
  <div class="sheet">
    <div class="grabber"></div>
    <h3 id="sheet-title">Новый товар</h3>
    <div class="img-picker">
      <div class="img-preview" id="img-preview"><span class="tic" style="width:34px;height:34px"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="12.5" r="4"/></svg></span></div>
      <div class="img-actions">
        <button class="btn btn-ghost" id="pick-image-btn"><span class="tic"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.4"/><path d="M3 17l6-6 7 7 4-4 1 1"/></svg></span> Выбрать фото</button>
        <button class="btn btn-ghost" id="remove-image-btn" style="display:none"><span class="tic"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V4h6v3"/></svg></span> Удалить фото</button>
        <input type="file" id="image-input" accept="image/*" style="display:none">
      </div>
    </div>
    <div class="field"><label for="f-name">Название</label><input id="f-name" placeholder="Капучино" maxlength="80"></div>
    <div class="row2">
      <div class="field"><label for="f-price">Цена, Br</label><input id="f-price" type="number" inputmode="decimal" min="0" step="0.1" placeholder="4.5"></div>
      <div class="field"><label for="f-volume">Граммовка / объём</label><input id="f-volume" placeholder="250 мл" maxlength="40"></div>
    </div>
    <div class="field"><label for="f-emoji">Эмодзи</label><input id="f-emoji" placeholder="испр. ☕" maxlength="4"></div>
    <div class="field"><label for="f-category">Категория</label><select id="f-category"></select></div>
    <div class="field"><label for="f-desc">Описание (необязательно)</label><input id="f-desc" placeholder="Кофе с молочной пеной" maxlength="300"></div>
    <div class="row2">
      <button class="btn btn-ghost" id="cancel-product-btn" style="flex:1">Отмена</button>
      <button class="btn btn-primary" id="save-product-btn" style="flex:1">Сохранить</button>
    </div>
  </div>
</div>

<div class="overlay" id="category-overlay">
  <div class="sheet">
    <div class="grabber"></div>
    <h3 id="category-title">Категория</h3>
    <div class="row2">
      <div class="field" style="max-width:110px"><label for="c-emoji">Эмодзи</label><input id="c-emoji" placeholder="испр. ☕" maxlength="4"></div>
      <div class="field"><label for="c-name">Название</label><input id="c-name" placeholder="Кофе" maxlength="60"></div>
    </div>
    <div class="row2">
      <button class="btn btn-ghost" id="cancel-category-btn" style="flex:1">Отмена</button>
      <button class="btn btn-primary" id="save-category-btn" style="flex:1">Сохранить</button>
    </div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (id) => document.getElementById(id);

// Gate: iframe outside of Telegram shows nothing but the hint
// Gate: no initData means the page is not running inside Telegram — show a muted overlay.

let orders = [];
let timer = null;


function money(n) { return Number(n || 0).toLocaleString('ru-RU') + ' Br'; }
function fmtCountdown(ms) { const t = Math.max(0, Math.floor(ms / 1000)); const m = String(Math.floor(t/60)).padStart(2,'0'); const s = String(t % 60).padStart(2,'0'); return `${m}:${s}`; }


async function loadOrders() {
  const data = await api('/api/orders');
  orders = Array.isArray(data) ? data : [];
  renderOrders();
}

function renderOrders() {
  const list = $('orders-box');
  if (!orders.length) { list.innerHTML = '<div class="empty"><b>Тишина на кухне</b>Новые заказы появятся здесь через пару секунд после оформления.</div>'; return; }
  list.innerHTML = [...orders].sort((a, b) => a.readyAt - b.readyAt).map((o) => {
    const remaining = o.readyAt - Date.now();
    const due = remaining <= 0;
    const statusClass = o.status === 'ready' ? 'ready' : (o.status === 'preparing' ? 'preparing' : '');
    const items = o.items.map((i) => `${i.qty}× ${i.name}`).join(', ');
    return `
      <div class="order ${due && o.status !== 'ready' ? 'due' : ''}">
        <div class="top">
          <div class="num">№${o.number}</div>
          <div class="status ${statusClass}">${o.status === 'new' ? 'Новый' : (o.status === 'preparing' ? 'Готовится' : 'Выдан')}</div>
        </div>
        <div class="items">${items}</div>
        <div class="meta"><span>Итого <b>${money(o.total)}</b></span><span>${o.payment === 'cash' ? '<span class="pic">'+_cashIco+'</span> Наличные' : '<span class="pic">'+_cardIco+'</span> Карта'}</span></div>
        <div class="countdown ${due && o.status !== 'ready' ? 'due' : ''}">
          <span>Осталось до готовности</span>
          <span class="time" data-countdown-for="${o.number}">${fmtCountdown(remaining)}</span>
        </div>
        ${o.status === 'new' || o.status === 'preparing' ? `<button class="btn" data-action="ready" data-id="${o.number}">Выдать заказ →</button>` : ''}
      </div>`;
  }).join('');

  list.querySelectorAll('[data-action="ready"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = Number(btn.dataset.id);
      await api(`/api/orders/${id}/ready`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      await loadOrders();
    });
  });
}

function tick() {
  document.querySelectorAll('[data-countdown-for]').forEach((el) => {
    const id = Number(el.dataset.countdownFor);
    const order = orders.find((o) => o.number === id);
    if (!order) return;
    const remaining = order.readyAt - Date.now();
    el.textContent = fmtCountdown(remaining);
    const card = el.closest('.order');
    if (card) card.classList.toggle('due', remaining <= 0 && order.status !== 'ready');
  });
}

async function init() {
  await loadOrders();
  timer = setInterval(tick, 1000);
  setInterval(loadOrders, 5000);
}

  const name = $('f-name').value.trim();
  const price = Number(String($('f-price').value).replace(',', '.'));
  if (!name) { toast('Введите название'); return; }
  if (!Number.isFinite(price) || price < 0) { toast('Некорректная цена'); return; }
  const payload = {
    name,
    price,
    desc: $('f-desc').value.trim(),
    emoji: ($('f-emoji').value || '').trim(),
    categoryId: $('f-category').value,
    volume: $('f-volume').value.trim(),
    image: imageData,
  };
  try {
    if (editId) await api('/api/barista/menu/products/' + encodeURIComponent(editId), { method: 'PUT', body: JSON.stringify(payload) });

    await loadMenu();

/* ---------- image picking ---------- */
function downscaleImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 512;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#241712';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  try {
    await api('/api/admin/baristas', { method: 'POST', body: JSON.stringify({ id, name }) });
    toast('Бариста добавлен');
    $('barista-add-id').value = '';
    $('barista-add-name').value = '';
    await loadBaristas();
  } catch (e) {
    toast(e.message || 'Не удалось добавить');
  }
}

async function removeBaristaUI(id) {
  const ok = await confirmDlg(`Удалить баристу ${id}?`);
  if (!ok) return;
  try {
    await api('/api/admin/baristas/' + id, { method: 'DELETE' });
    toast('Бариста удалён');
    await loadBaristas();
  } catch (e) {
    toast(e.message || 'Не удалось удалить');
  }
}

$('barista-add-btn').addEventListener('click', addBaristaUI);

loadMenu();
loadBaristas();

</script>
</body>
</html>
